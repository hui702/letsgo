<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="A retro pixel catching game" />
  <title>第一天的冒險</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;800&family=Press+Start+2P&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="game-shell">
    <header class="masthead">
        <div>
          <p class="eyebrow" id="eyebrow">第一關</p>
        </div>
      <div class="score" aria-label="Score"><span id="scoreLabel">分數</span><strong id="score">000</strong></div>
    </header>

    <section class="pixel-frame" aria-label="Pixel catching game">
      <div class="hud" aria-label="Collection goals">
        <div class="goal" data-goal="square"><span class="goal-icon square"></span><span id="squares">0/3</span></div>
        <div class="goal" data-goal="cross"><span class="goal-icon cross"></span><span id="crosses">0/4</span></div>
        <div class="goal" data-goal="heart"><span class="goal-icon heart"></span><span id="hearts">0/5</span></div>
      </div>
      <div class="arena" id="arena">
        <canvas id="game" aria-label="Move the basket to catch falling items"></canvas>
        <div class="pause-layer" id="startLayer">
          <button class="start-button" id="startButton" type="button">開始遊戲</button>
        </div>
      </div>
    </section>
    </main>

    <div class="modal-backdrop" id="introBackdrop">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="introTitle">
        <h2 id="introTitle">歡迎來到第一天的冒險！</h2>
        <div class="intro-copy" id="introCopy"></div>
        <button class="modal-button" id="introButton" type="button">我準備好了</button>
      </section>
    </div>

    <div class="modal-backdrop" id="milestoneBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="milestoneTitle">
      <h2 id="milestoneTitle">完成目標！</h2>
      <div class="stage-gallery" id="stageGallery" aria-label="Stage photo gallery" hidden>
        <div class="stage-photo-frame">
          <img id="stagePhoto" alt="" />
        </div>
        <div class="stage-gallery-controls">
          <button class="gallery-button" id="previousPhoto" type="button" aria-label="Previous photo" title="Previous photo">&#8249;</button>
          <span class="photo-count" id="photoCount" aria-live="polite">1 / 1</span>
          <button class="gallery-button" id="nextPhoto" type="button" aria-label="Next photo" title="Next photo">&#8250;</button>
        </div>
      </div>
      <p class="note milestone-note" id="milestoneNote"></p>
      <div class="modal-actions">
        <button class="modal-button" id="continueButton" type="button">下一關</button>
        <button class="modal-button avoid-button" id="avoidButton" type="button" hidden>我才不要跟妳說</button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="victoryBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="victoryTitle">
      <h2 id="victoryTitle">冒險完成！</h2>
      <div class="stage-gallery" id="finalGallery" aria-label="Final photo gallery" hidden>
        <div class="stage-photo-frame" id="finalPhotoFrame">
          <img id="finalPhoto" alt="" />
        </div>
        <div class="stage-gallery-controls">
          <button class="gallery-button" id="previousFinalPhoto" type="button" aria-label="Previous photo" title="Previous photo">&#8249;</button>
          <span class="photo-count" id="finalPhotoCount" aria-live="polite">1 / 1</span>
          <button class="gallery-button" id="nextFinalPhoto" type="button" aria-label="Next photo" title="Next photo">&#8250;</button>
        </div>
      </div>
      <article class="letter" id="letter"></article>
      <button class="modal-button" id="restartButton" type="button">再玩一次</button>
    </section>
  </div>

  <script src="./content.js"></script>
  <script src="./script.js"></script>
</body>

</html>
