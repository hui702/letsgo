<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="A retro pixel catching game" />
  <title>第一天的冒險</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;800&family=Press+Start+2P&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --ink: #202450;
      --cream: #fff9eb;
      --pink: #ff9ebe;
      --pink-deep: #e95086;
      --mint: #a8e5d0;
      --sky: #8bc8f7;
      --gold: #ffd768;
      --line: #202450;
      font-family: "Press Start 2P", monospace;
      color: var(--ink);
      background: #8bc8f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, .15) 1px, transparent 1px) 0 0 / 18px 18px,
        linear-gradient(rgba(255, 255, 255, .15) 1px, transparent 1px) 0 0 / 18px 18px,
        #8bc8f7;
    }

    button {
      font: inherit;
    }

    .game-shell {
      width: min(100%, 900px);
      margin: 0 auto;
      padding: 20px 16px 28px;
    }

    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #fff;
      font-size: clamp(9px, 1.5vw, 12px);
      text-shadow: 2px 2px 0 var(--ink);
    }

    h1 {
      margin: 0;
      font-size: clamp(19px, 4vw, 34px);
      line-height: 1.35;
      letter-spacing: 0;
      color: var(--cream);
      text-shadow: 4px 4px 0 var(--pink-deep), 7px 7px 0 var(--ink);
    }

    .score {
      min-width: 94px;
      padding: 12px 10px;
      border: 4px solid var(--ink);
      background: var(--gold);
      box-shadow: 5px 5px 0 var(--ink);
      text-align: center;
      font-size: 10px;
      line-height: 1.55;
    }

    .score strong {
      display: block;
      font-size: 16px;
    }

    .pixel-frame {
      border: 5px solid var(--ink);
      background: var(--cream);
      box-shadow: 8px 8px 0 var(--ink);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 4px solid var(--ink);
      background: var(--cream);
    }

    .goal {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 64px;
      border-right: 3px solid var(--ink);
      font-size: 11px;
    }

    .goal:last-child {
      border-right: 0;
    }

    .goal {
      transition: opacity .2s ease, background .2s ease;
    }

    .goal.is-locked {
      opacity: .38;
    }

    .goal.is-active {
      background: #fff0b8;
    }

    .goal.is-complete {
      background: var(--mint);
    }

    .goal-icon {
      width: 19px;
      height: 19px;
      image-rendering: pixelated;
    }

    .goal-icon.heart {
      background: var(--pink-deep);
      clip-path: polygon(50% 92%, 8% 54%, 8% 22%, 25% 8%, 50% 23%, 75% 8%, 92% 22%, 92% 54%);
    }

    .goal-icon.square {
      background: var(--sky);
      border: 3px solid var(--ink);
    }

    .goal-icon.cross {
      background: #8f563e;
      clip-path: polygon(31% 0, 69% 0, 69% 31%, 100% 31%, 100% 69%, 69% 69%, 69% 100%, 31% 100%, 31% 69%, 0 69%, 0 31%, 31% 31%);
    }

    .arena {
      position: relative;
      aspect-ratio: 16 / 10;
      min-height: 370px;
      overflow: hidden;
      touch-action: none;
      background: #d5f0ff;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      image-rendering: pixelated;
    }

    .pause-layer {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(32, 36, 80, .28);
    }

    .pause-layer[hidden] {
      display: none;
    }

    .start-button,
    .modal-button {
      border: 4px solid var(--ink);
      padding: 15px 17px;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-weight: 800;
      color: var(--cream);
      background: var(--pink-deep);
      box-shadow: 5px 5px 0 var(--ink);
      cursor: pointer;
      font-size: 12px;
      line-height: 1.5;
    }

    .start-button:hover,
    .modal-button:hover {
      background: #d63d72;
    }

    .start-button:active,
    .modal-button:active {
      transform: translate(4px, 4px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .modal-backdrop {
      position: fixed;
      z-index: 4;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(32, 36, 80, .65);
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .modal {
      width: min(100%, 640px);
      max-height: min(760px, calc(100vh - 36px));
      overflow: auto;
      border: 5px solid var(--ink);
      padding: clamp(20px, 5vw, 34px);
      background: var(--cream);
      box-shadow: 10px 10px 0 var(--pink-deep), 15px 15px 0 var(--ink);
      text-align: center;
    }

    .modal h2 {
      margin: 0 0 20px;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-weight: 800;
      font-size: clamp(16px, 3vw, 24px);
      line-height: 1.45;
    }

    .polaroid {
      width: min(100%, 280px);
      margin: 0 auto 22px;
      padding: 10px 10px 30px;
      border: 3px solid var(--ink);
      background: white;
      box-shadow: 5px 5px 0 var(--ink);
      transform: rotate(-2deg);
    }

    .polaroid img {
      width: 100%;
      aspect-ratio: 1 / .8;
      object-fit: cover;
      background: linear-gradient(135deg, var(--pink), var(--gold), var(--sky));
    }

    .polaroid figcaption {
      margin-top: 14px;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
    }

      .note {
        margin: 0 auto 22px;
      max-width: 520px;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: clamp(18px, 3.5vw, 22px);
      font-weight: 700;
      line-height: 1.65;
      }

      .intro-copy {
        margin: 0 auto 24px;
        max-width: 480px;
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.9;
        text-align: left;
      }

      .intro-copy p { margin: 0 0 12px; }
      .intro-copy p:last-child { margin-bottom: 0; }

    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin: 0 auto 24px;
      max-width: 560px;
    }

    .milestone-memory {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(58px, 1fr));
      gap: 8px;
      min-height: 330px;
      margin-bottom: 22px;
    }

    .milestone-memory .note {
      z-index: 1;
      grid-column: 2 / 6;
      grid-row: 2 / 4;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 18px;
      border: 3px solid var(--pink-deep);
      background: rgba(255, 249, 235, .96);
      box-shadow: 4px 4px 0 var(--ink);
    }

    .milestone-memory figure:nth-of-type(1) { grid-column: 1; grid-row: 1; }
    .milestone-memory figure:nth-of-type(2) { grid-column: 2; grid-row: 1; }
    .milestone-memory figure:nth-of-type(3) { grid-column: 3; grid-row: 1; }
    .milestone-memory figure:nth-of-type(4) { grid-column: 4; grid-row: 1; }
    .milestone-memory figure:nth-of-type(5) { grid-column: 5; grid-row: 1; }
    .milestone-memory figure:nth-of-type(6) { grid-column: 6; grid-row: 1; }
    .milestone-memory figure:nth-of-type(7) { grid-column: 1; grid-row: 2; }
    .milestone-memory figure:nth-of-type(8) { grid-column: 6; grid-row: 2; }
    .milestone-memory figure:nth-of-type(9) { grid-column: 1; grid-row: 3; }
    .milestone-memory figure:nth-of-type(10) { grid-column: 6; grid-row: 3; }
    }

    .photo-tile {
      aspect-ratio: 1;
      width: 100%;
      margin: 0;
      overflow: hidden;
      border: 2px solid var(--ink);
      background: var(--pink);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .photo-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .letter {
      margin: 0 0 25px;
      padding: 20px;
      border: 3px dashed var(--pink-deep);
      background: #fff;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: clamp(17px, 3.5vw, 20px);
      font-weight: 500;
      line-height: 1.9;
      text-align: left;
    }

    .letter p {
      margin: 0 0 12px;
    }

    .letter p:last-child {
      margin-bottom: 0;
    }

    @media (max-width: 520px) {
      .game-shell {
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        align-content: start;
        padding:
          max(12px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      }

      .masthead {
        align-items: center;
        margin-bottom: 10px;
      }

      .eyebrow {
        margin-bottom: 5px;
      }

      h1 {
        font-size: clamp(17px, 6vw, 24px);
      }

      .score {
        min-width: 76px;
        padding: 8px 6px;
        font-size: 8px;
      }

      .score strong {
        font-size: 12px;
      }

      .pixel-frame {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: 0;
        align-self: stretch;
      }

      .arena {
        height: clamp(310px, calc(100svh - 165px), 610px);
        min-height: 0;
        aspect-ratio: auto;
      }

      .goal {
        min-height: 55px;
        gap: 5px;
        font-size: 9px;
      }

      .goal-icon {
        width: 15px;
        height: 15px;
      }

      .modal-backdrop {
        padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      }

      .modal {
        max-height: calc(100svh - 28px);
        padding: 20px 16px;
      }

      .letter {
        padding: 16px;
      }

      .photo-gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

    }

    @media (max-width: 720px) and (orientation: landscape) {
      .game-shell {
        padding-block: 8px;
      }

      .masthead {
        margin-bottom: 6px;
      }

      .eyebrow {
        display: none;
      }

      .arena {
        min-height: 260px;
      }

      .goal {
        min-height: 45px;
      }

    }
  </style>
</head>

<body>
  <main class="game-shell">
    <header class="masthead">
        <div>
          <p class="eyebrow" id="eyebrow">第一關</p>
        </div>
      <div class="score" aria-label="分數"><span id="scoreLabel">分數</span><strong id="score">000</strong></div>
    </header>

    <section class="pixel-frame" aria-label="Pixel catching game">
      <div class="hud" aria-label="Collection goals">
        <div class="goal" data-goal="square"><span class="goal-icon square"></span><span id="squares">0/3</span></div>
        <div class="goal" data-goal="cross"><span class="goal-icon cross"></span><span id="crosses">0/4</span></div>
        <div class="goal" data-goal="heart"><span class="goal-icon heart"></span><span id="hearts">0/5</span></div>
      </div>
      <div class="arena" id="arena">
        <canvas id="game" aria-label="移動籃子接住掉落物品"></canvas>
        <div class="pause-layer" id="startLayer">
          <button class="start-button" id="startButton" type="button">開始遊戲</button>
        </div>
      </div>
    </section>
    </main>

    <div class="modal-backdrop" id="introBackdrop">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="introTitle">
        <h2 id="introTitle">歡迎來到第一天的冒險！</h2>
        <div class="intro-copy" id="introCopy"></div>
        <button class="modal-button" id="introButton" type="button">我準備好了</button>
      </section>
    </div>

    <div class="modal-backdrop" id="milestoneBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="milestoneTitle">
      <h2 id="milestoneTitle">完成目標！</h2>
      <div class="milestone-memory">
        <p class="note" id="milestoneNote"></p>
      </div>
      <button class="modal-button" id="continueButton" type="button">下一關</button>
    </section>
  </div>

  <div class="modal-backdrop" id="victoryBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="victoryTitle">
      <h2 id="victoryTitle">冒險完成！</h2>
      <div class="photo-gallery" id="photoGallery" aria-label="回憶照片牆"></div>
      <article class="letter" id="letter"></article>
      <button class="modal-button" id="restartButton" type="button">再玩一次</button>
    </section>
  </div>

  <script src="./content.js"></script>
  <script>
    "use strict";

    const canvas = document.getElementById("game");
    const context = canvas.getContext("2d");
    const arena = document.getElementById("arena");
    const scoreEl = document.getElementById("score");
    const startLayer = document.getElementById("startLayer");
    const targets = Object.fromEntries(
      Object.entries(GAME_CONTENT.stages).map(([type, stage]) => [type, stage.target])
    );
    const collected = { heart: 0, cross: 0, square: 0 };
    const stageTypes = ["square", "cross", "heart"];
    const counterIds = { heart: "hearts", cross: "crosses", square: "squares" };
    const colors = { heart: "#e95086", cross: "#8f563e", square: "#5aaee9", hazard: "#7865b4" };
    let width = 0, height = 0, lastTime = 0, spawnTimer = 0, score = 0;
    let playing = false, frozenUntil = 0, shake = 0, stageIndex = 0;
    let items = [], particles = [], confetti = [];
    const player = { x: .5, y: .88, width: .16 };
    const pressed = new Set();
    let dragState = null;

    function applyContent() {
      const ui = GAME_CONTENT.ui;
      document.title = ui.pageTitle;
      document.getElementById("eyebrow").textContent = ui.eyebrow;
      document.getElementById("scoreLabel").textContent = ui.scoreLabel;
      document.getElementById("startButton").textContent = ui.startButton;
        document.getElementById("continueButton").textContent = ui.continueButton;
        document.getElementById("restartButton").textContent = ui.restartButton;
        document.getElementById("introTitle").textContent = GAME_CONTENT.intro.title;
        document.getElementById("introCopy").innerHTML = GAME_CONTENT.intro.lines
          .map(text => "<p>" + text + "</p>")
          .join("");
        document.getElementById("introButton").textContent = GAME_CONTENT.intro.button;
      document.getElementById("victoryTitle").textContent = ui.victoryTitle;
    }

    function resize() {
      const rect = arena.getBoundingClientRect();
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(rect.width * ratio);
      canvas.height = Math.round(rect.height * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      width = rect.width;
      height = rect.height;
    }

    function drawPixelHeart(x, y, size, color) {
      const s = size / 5;
      context.fillStyle = color;
      [[1, 0], [3, 0], [0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [1, 3], [2, 3], [3, 3], [2, 4]].forEach(([px, py]) => context.fillRect(x + px * s, y + py * s, s, s));
    }

    function drawCross(x, y, size) {
      const arm = size * .32;
      context.fillStyle = colors.cross;
      context.fillRect(x + arm, y, size - arm * 2, size);
      context.fillRect(x, y + arm, size, size - arm * 2);
      context.fillStyle = "#f3d4b3";
      context.fillRect(x + arm + size * .08, y + arm + size * .08, size * .14, size * .14);
    }

    function drawSquare(x, y, size) {
      context.fillStyle = colors.square;
      context.fillRect(x, y, size, size);
      context.fillStyle = "#d9f4ff";
      context.fillRect(x + size * .2, y + size * .2, size * .24, size * .24);
    }

    function drawHazard(x, y, size) {
      context.fillStyle = colors.hazard;
      context.fillRect(x + size * .25, y, size * .5, size * .16);
      context.fillRect(x + size * .15, y + size * .16, size * .7, size * .7);
      context.fillStyle = "#f5dcff";
      context.fillRect(x + size * .28, y + size * .42, size * .44, size * .2);
      context.fillStyle = "#202450";
      context.fillRect(x + size * .44, y + size * .22, size * .12, size * .12);
    }

      function drawBasket() {
        const basketWidth = player.width * width;
        const basketHeight = Math.max(30, height * .09);
        const x = player.x * width - basketWidth / 2;
        const y = player.y * height;
        if (performance.now() < frozenUntil) {
          context.fillStyle = "rgba(120, 101, 180, .45)";
          context.fillRect(x - 7, y - 7, basketWidth + 14, basketHeight + 14);
          context.fillStyle = "#f5dcff";
          context.fillRect(x - 4, y - 4, basketWidth + 8, 4);
        }
        context.fillStyle = "#b86d4b";
      context.fillRect(x, y + basketHeight * .25, basketWidth, basketHeight * .68);
      context.fillStyle = "#ffd768";
      context.fillRect(x + basketWidth * .13, y + basketHeight * .39, basketWidth * .74, basketHeight * .12);
      context.fillStyle = "#fff9eb";
      context.fillRect(x + basketWidth * .18, y, basketWidth * .1, basketHeight * .25);
      context.fillRect(x + basketWidth * .72, y, basketWidth * .1, basketHeight * .25);
    }

    function drawBackground(time) {
      context.fillStyle = "#d5f0ff";
      context.fillRect(0, 0, width, height);
      context.fillStyle = "#a8e5d0";
      context.fillRect(0, height * .79, width, height * .21);
      for (let i = 0; i < 11; i++) {
        const x = ((i * 97 + time * .006) % (width + 35)) - 18;
        const y = 30 + ((i * 63) % (height * .65));
        drawPixelHeart(x, y, 10, "rgba(255, 158, 190, .55)");
      }
      context.fillStyle = "#fff9eb";
      for (let i = 0; i < 6; i++) {
        const x = (i * 151 + 35) % width;
        const y = 58 + (i % 3) * 87;
        context.fillRect(x, y, 34, 6);
        context.fillRect(x + 7, y - 6, 20, 6);
      }
    }

    function spawnItem() {
      const roll = Math.random();
      const type = roll < .4 ? stageTypes[stageIndex] : "hazard";
      items.push({
        type,
        x: .08 + Math.random() * .84,
        y: -.08,
        speed: .32 + Math.random() * .20,
        size: Math.max(21, Math.min(32, width * .045)),
        drift: (Math.random() - .5) * .09
      });
    }

    function burst(x, y, color, amount = 10) {
      for (let i = 0; i < amount; i++) {
        particles.push({ x, y, vx: (Math.random() - .5) * 150, vy: (Math.random() - .7) * 170, life: .45 + Math.random() * .3, color });
      }
    }

    function catchItem(item) {
      const x = item.x * width, y = item.y * height;
        if (item.type === "hazard") {
          frozenUntil = performance.now() + 1000;
        score = Math.max(0, score - 15);
        shake = 13;
        burst(x, y, colors.hazard, 16);
      } else {
        collected[item.type]++;
        score += 10;
        burst(x, y, colors[item.type]);
          document.getElementById(counterIds[item.type]).textContent = collected[item.type] + "/" + targets[item.type];
        if (collected[item.type] === targets[item.type]) {
          items = [];
          showMilestone(item.type);
        }
      }
      scoreEl.textContent = String(score).padStart(3, "0");
    }

    function showMilestone(type) {
      playing = false;
      updateStageUI();
      const data = GAME_CONTENT.stages[type];
      document.getElementById("milestoneTitle").textContent = data.title;
      document.getElementById("milestoneNote").textContent = data.message;
      document.getElementById("continueButton").textContent =
        stageIndex === stageTypes.length - 1
          ? GAME_CONTENT.ui.finishButton
          : GAME_CONTENT.ui.continueButton;
        renderMilestonePhotos(data.photos);
        document.getElementById("milestoneBackdrop").hidden = false;
    }

    function updateStageUI() {
      stageTypes.forEach((type, index) => {
        const goal = document.querySelector('[data-goal="' + type + '"]');
        goal.classList.toggle("is-active", index === stageIndex && collected[type] < targets[type]);
        goal.classList.toggle("is-complete", collected[type] >= targets[type]);
        goal.classList.toggle("is-locked", index > stageIndex);
      });
      document.getElementById("eyebrow").textContent = GAME_CONTENT.ui.stageLabels[stageIndex];
    }

    function setImage(image, source) {
      const asset = typeof source === "string" ? { src: source } : source;
      let fallbackUsed = false;

      image.onerror = () => {
        if (asset.fallback && !fallbackUsed) {
          fallbackUsed = true;
          image.src = asset.fallback;
          return;
        }
        image.removeAttribute("src");
        image.alt = GAME_CONTENT.ui.missingPhoto + asset.src;
      };
      image.src = asset.src;
    }

    function renderPhotoGallery(galleryId, photos) {
      const gallery = document.getElementById(galleryId);
      gallery.replaceChildren();
      gallery.hidden = !photos || photos.length === 0;

      (photos || []).slice(0, 10).forEach((asset, index) => {
        const tile = document.createElement("figure");
        const image = document.createElement("img");
        const label = asset.caption || "回憶照片 " + (index + 1);

        tile.className = "photo-tile";
        image.alt = label;
        image.loading = "eager";
        image.title = label;
        setImage(image, asset);
        tile.append(image);
        gallery.append(tile);
      });
    }

    function renderMilestonePhotos(photos) {
      const memory = document.querySelector(".milestone-memory");
      memory.querySelectorAll(".milestone-photo").forEach(tile => tile.remove());

      (photos || []).slice(0, 10).forEach((asset, index) => {
        const tile = document.createElement("figure");
        const image = document.createElement("img");
        const label = asset.caption || "回憶照片 " + (index + 1);

        tile.className = "photo-tile milestone-photo";
        image.alt = label;
        image.loading = "eager";
        image.title = label;
        setImage(image, asset);
        tile.append(image);
        memory.append(tile);
      });
    }

    function renderGallery() {
      renderPhotoGallery("photoGallery", GAME_CONTENT.photos.gallery);
    }

    function win() {
      playing = false;
      for (let i = 0; i < 120; i++) {
        confetti.push({ x: Math.random() * width, y: -Math.random() * height, vy: 40 + Math.random() * 120, size: 4 + Math.random() * 8, color: [colors.heart, colors.cross, colors.square, colors.hazard][i % 4] });
      }
      setTimeout(() => {
        document.getElementById("letter").innerHTML = GAME_CONTENT.letter.map(text => "<p>" + text + "</p>").join("");
        document.getElementById("victoryBackdrop").hidden = false;
      }, 650);
    }

    function update(delta, now) {
      const speed = (pressed.has("ArrowLeft") || pressed.has("a") || pressed.has("A") ? -1 : 0) + (pressed.has("ArrowRight") || pressed.has("d") || pressed.has("D") ? 1 : 0);
      if (now >= frozenUntil) player.x = Math.max(.08, Math.min(.92, player.x + speed * delta * .65));
      items.forEach(item => { item.y += item.speed * delta; item.x += item.drift * delta; });
      const basketY = player.y * height;
      const basketHalf = player.width * width * .52;
      items = items.filter(item => {
        const x = item.x * width, y = item.y * height;
        if (y > basketY - 16 && y < basketY + 45 && Math.abs(x - player.x * width) < basketHalf) {
          catchItem(item);
          return false;
        }
        return y < height + 50;
      });
      particles.forEach(p => { p.x += p.vx * delta; p.y += p.vy * delta; p.vy += 350 * delta; p.life -= delta; });
      particles = particles.filter(p => p.life > 0);
    }

    function render(time) {
      context.save();
      if (shake > 0) {
        context.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
        shake *= .82;
      }
      drawBackground(time);
      items.forEach(item => {
        const x = item.x * width - item.size / 2, y = item.y * height - item.size / 2;
        if (item.type === "heart") drawPixelHeart(x, y, item.size, colors.heart);
        if (item.type === "cross") drawCross(x, y, item.size);
        if (item.type === "square") drawSquare(x, y, item.size);
        if (item.type === "hazard") drawHazard(x, y, item.size);
      });
      particles.forEach(p => { context.globalAlpha = Math.max(0, p.life * 1.5); context.fillStyle = p.color; context.fillRect(p.x, p.y, 5, 5); });
      context.globalAlpha = 1;
      confetti.forEach(piece => { context.fillStyle = piece.color; context.fillRect(piece.x, piece.y, piece.size, piece.size); piece.y += piece.vy / 60; });
      drawBasket();
      context.restore();
    }

    function loop(time) {
      const delta = Math.min((time - lastTime) / 1000 || 0, .05);
      lastTime = time;
      if (playing) {
        spawnTimer += delta;
        if (spawnTimer > .55) { spawnItem(); spawnTimer = 0; }
        update(delta, time);
      }
      render(time);
      requestAnimationFrame(loop);
    }

    function begin() {
      playing = true;
      startLayer.hidden = true;
    }

    function reset() {
      Object.keys(collected).forEach(type => {
        collected[type] = 0;
          document.getElementById(counterIds[type]).textContent = "0/" + targets[type];
      });
      items = []; particles = []; confetti = []; score = 0; stageIndex = 0; player.x = .5;
      scoreEl.textContent = "000";
      updateStageUI();
      document.getElementById("victoryBackdrop").hidden = true;
      begin();
    }

      document.getElementById("startButton").addEventListener("click", begin);
      document.getElementById("introButton").addEventListener("click", () => {
        document.getElementById("introBackdrop").hidden = true;
      });
      document.getElementById("continueButton").addEventListener("click", () => {
      document.getElementById("milestoneBackdrop").hidden = true;
      if (stageIndex === stageTypes.length - 1) {
        win();
        return;
      }
      items = [];
      stageIndex++;
      updateStageUI();
      playing = true;
    });
    document.getElementById("restartButton").addEventListener("click", reset);
    window.addEventListener("keydown", event => {
      if (["ArrowLeft", "ArrowRight", "a", "A", "d", "D"].includes(event.key)) {
        event.preventDefault();
        pressed.add(event.key);
      }
    });
    window.addEventListener("keyup", event => pressed.delete(event.key));
      function startDrag(event) {
        if (performance.now() < frozenUntil) return;
        const rect = arena.getBoundingClientRect();
        dragState = {
          pointerId: event.pointerId,
          startX: event.clientX,
          playerX: player.x,
          arenaWidth: rect.width
        };
        arena.setPointerCapture(event.pointerId);
      }

      function movePlayerWithDrag(event) {
        if (!dragState || event.pointerId !== dragState.pointerId || performance.now() < frozenUntil) return;
        const distance = (event.clientX - dragState.startX) / dragState.arenaWidth;
        player.x = Math.max(.08, Math.min(.92, dragState.playerX + distance));
      }

      function endDrag(event) {
        if (dragState && event.pointerId === dragState.pointerId) dragState = null;
      }

    arena.addEventListener("pointerdown", startDrag);
    arena.addEventListener("pointermove", movePlayerWithDrag);
    arena.addEventListener("pointerup", endDrag);
    arena.addEventListener("pointercancel", endDrag);
    arena.addEventListener("lostpointercapture", endDrag);
    window.addEventListener("resize", resize);

    resize();
    applyContent();
    updateStageUI();
    requestAnimationFrame(loop);
  </script>
</body>
